<!DOCTYPE html>
<html>
<head>
	<!--linking html to external css - 'style.css' -->

	<link rel="stylesheet" href="style4.css">

</head>
<body>
	<center>
		<h1 style="font-size: 100; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif; text-align: center; color: rgb(255, 255, 255); letter-spacing: 4px;"> Registration </h1>

<form action="success.html">
  <div class="container">
    <p style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">Please fill in this form to register.</p>
    <hr>

    <label style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;" for="email"><b>Email</b></label>
    <input type="text" placeholder="Enter Email" name="email" id="email" required>

    <label style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;" for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="psw" id="psw" required>

    <label style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;" for="psw-repeat"><b>Repeat Password</b></label>
    <input type="password" placeholder="Repeat Password" name="psw-repeat" id="psw-repeat" required>
    <hr>
    <label style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;" for="name"><b>Full Name</b></label>
    <input type="text" placeholder="Enter Name" name="name" id="name" required>
    <label style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;" for="number"><b>Phone Number</b></label>
    <input type="number" placeholder="Enter Phone Number" name="number" id="number" required>


    <p style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>
    <button style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;" type="submit" class="registerbtn">Register</button>
  </div>

  <div class="container signin">
    <p style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">Already have an account? <a href="#">Sign in</a>.</p>
  </div>
</form>

</center>
</body>
</html>
